# Stack completo de VibeAudit (producción y desarrollo vía docker compose).
#
# Uso en desarrollo:
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Producción (EC2):
#   docker compose up -d --build
#   docker compose --profile sonar up -d   # + SonarQube (opcional)
#
# Parar: docker compose down  (conserva los volúmenes pgdata/artifacts/history)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibeaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibeaudit}
      POSTGRES_DB: ${POSTGRES_DB:-vibeaudit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibeaudit} -d ${POSTGRES_DB:-vibeaudit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VIBEAUDIT_DATABASE_URL: postgresql://${POSTGRES_USER:-vibeaudit}:${POSTGRES_PASSWORD:-vibeaudit}@postgres:5432/${POSTGRES_DB:-vibeaudit}
      VIBEAUDIT_ARTIFACTS: /data/artifacts
      VIBEAUDIT_HISTORY: /data/history
      VIBEAUDIT_API_HOST: 0.0.0.0
      VIBEAUDIT_API_PORT: 8000
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      SUPABASE_ACCESS_TOKEN: ${SUPABASE_ACCESS_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - artifacts:/data/artifacts
      - history:/data/history
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # URL que el navegador usará para llamar a la API. Default: el host
      # Tailscale de la máquina (accesible desde cualquier dispositivo del
      # tailnet). Sobrescribir con NEXT_PUBLIC_API_URL en .env si cambia.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://andiso67lab.tail809b38.ts.net:8000}
    ports:
      - "3000:3000"

  sonarqube:
    image: sonarqube:community
    profiles: ["sonar"]
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ports:
      - "9000:9000"

volumes:
  pgdata:
  artifacts:
  history:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
