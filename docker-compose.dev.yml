# Override de desarrollo: hot-reload en API y dashboard, postgres accesible
# desde el host y /tmp montado para escanear repos locales.
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  postgres:
    ports:
      - "5432:5432"

  api:
    command: uvicorn vibeaudit.api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./vibeaudit:/app/vibeaudit
      - /tmp:/tmp

  dashboard:
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
      - dashboard_next:/app/.next

volumes:
  dashboard_node_modules:
  dashboard_next:
