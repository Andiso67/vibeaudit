[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeaudit"
version = "0.1.0"
description = "Auditoría automática de repositorios Git (Vibe Coding Audit): secretos, SAST e IaC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "DCTechnologies" }]

# Mantener en sync con requirements.txt
dependencies = [
    "gitpython==3.1.40",
    "pydantic==2.13.4",
    "typer==0.9.0",
    "rich==13.7.0",
    "pyyaml==6.0.1",
    "httpx==0.28.1",
    "reportlab==5.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
api = ["fastapi==0.128.8", "uvicorn==0.39.0"]

[project.scripts]
vibeaudit = "vibeaudit.cli:main"
vibeaudit-api = "vibeaudit.api:main"

[tool.setuptools.packages.find]
include = ["vibeaudit*"]

[tool.setuptools.package-data]
vibeaudit = ["checklists/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
